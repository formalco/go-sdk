name: release
on:
  push:
    branches:
      - v3
    paths:
      - VERSION
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      -
        name: Read VERSION
        id: version
        run: |
          set -euo pipefail
          VERSION="$(tr -d ' \r\n' < VERSION)"
          if [[ ! "${VERSION}" =~ ^3\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must hold a bare 3.Y.Z version to match module path /v3, got: ${VERSION}"
            exit 1
          fi
          # Tag existence, not a diff against the parent commit, so re-runs and
          # manual dispatches after a failed release pick up where they stopped.
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "v${VERSION} is already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v${VERSION}"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi
      -
        name: Create and push tag
        if: steps.version.outputs.release == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "release ${TAG}"
          git push origin "refs/tags/${TAG}"
        env:
          TAG: ${{ steps.version.outputs.tag }}
